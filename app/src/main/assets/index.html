<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SignalPaper HOON</title><style>:root{--o:#f36b21;--od:#d9530f;--bg:#fff9f5;--ink:#171717;--mut:#777982;--line:#ece8e4;--g:#14804a;--r:#d83a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.top{background:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.hello{font-size:13px;color:var(--mut)}h1{font-size:22px;margin:2px 0 0}.hero{margin:16px 16px 0;background:linear-gradient(145deg,#f77a30,#e95b13);color:#fff;border-radius:26px;padding:20px;box-shadow:0 18px 36px rgba(232,91,20,.22)}.label{font-size:13px;opacity:.76}.value{font-size:32px;font-weight:750;margin-top:5px}.gain{display:inline-block;margin-top:9px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 10px;font-size:13px}.chart{width:100%;height:88px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 20px rgba(30,25,22,.045)}.card small{color:var(--mut)}.card b{display:block;margin-top:6px;font-size:18px}.section{padding:4px 16px 14px}.section h2{font-size:17px;margin:10px 0 12px}.holding{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;margin-bottom:11px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:0 7px 20px rgba(30,25,22,.04)}.logo{width:48px;height:48px;border-radius:16px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}.meta{flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750}.sub{font-size:12px;color:var(--mut);margin-top:3px}.right{text-align:right}.positive{color:var(--g)}.negative{color:var(--r)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:transparent;color:var(--mut);font-size:11px;padding:7px}.nav.active{color:var(--od);font-weight:750}.screen{display:none}.screen.active{display:block}.news{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#ebf8f1;color:var(--g);font-size:11px;font-weight:700}.mixed{background:#fff1e8;color:var(--od)}.news h3{font-size:15px;line-height:1.35}.news p{font-size:13px;line-height:1.55;color:#555}.tradebox{margin:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#f5f3f1;padding:4px;border-radius:15px}.seg button{border:0;background:transparent;padding:11px;border-radius:12px;font-weight:700}.seg button.on{background:var(--o);color:#fff}.select,input{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;font-size:16px}.primary{width:100%;border:0;background:var(--o);color:#fff;border-radius:16px;padding:14px;font-weight:750;font-size:16px;margin-top:16px;box-shadow:0 9px 20px rgba(243,107,33,.22)}.toast{position:fixed;left:16px;right:16px;bottom:88px;background:#24211f;color:#fff;padding:13px 15px;border-radius:15px;display:none;z-index:20}</style></head><body><header class="top"><div class="hello">Good morning,</div><h1>HOON</h1></header><main><section id="home" class="screen active"><article class="hero"><div class="label">Total portfolio value</div><div id="totalValue" class="value"></div><div id="totalGain" class="gain"></div><svg class="chart" viewBox="0 0 520 100"><path d="M0 88 C45 82 70 89 110 70 C150 51 180 75 220 54 C260 34 290 62 330 44 C370 25 400 48 440 27 C475 9 495 28 520 18" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M0 88 C45 82 70 89 110 70 C150 51 180 75 220 54 C260 34 290 62 330 44 C370 25 400 48 440 27 C475 9 495 28 520 18 L520 100 L0 100Z" fill="rgba(255,255,255,.12)"/></svg></article><div class="grid"><article class="card"><small>Invested amount</small><b id="cost"></b></article><article class="card"><small>Positions</small><b>5 stocks</b></article></div><section class="section"><h2>Top positions</h2><div id="homeHoldings"></div></section></section><section id="holdings" class="screen"><section class="section"><h2>Your holdings</h2><div id="allHoldings"></div></section></section><section id="news" class="screen"><section class="section"><h2>Portfolio intelligence</h2><div id="newsList"></div></section></section><section id="trade" class="screen"><div class="tradebox"><div class="seg"><button id="buyBtn" class="on">Buy</button><button id="sellBtn">Sell</button></div><select id="symbol" class="select"></select><input id="qty" type="number" min="1" value="1"><div class="card" style="margin-top:12px"><small>Estimated order</small><b id="estimate"></b></div><button id="order" class="primary">Place demo buy</button></div></section></main><nav class="bottom"><button class="nav active" data-screen="home">Home</button><button class="nav" data-screen="holdings">Holdings</button><button class="nav" data-screen="news">News</button><button class="nav" data-screen="trade">Trade</button></nav><div id="toast" class="toast"></div><script>const initial=[{s:'NVDA',n:'NVIDIA',q:162,a:41,p:202.81,c:-2.21,col:'#76b900'},{s:'AAPL',n:'Apple',q:14,a:382,p:333.74,c:.14,col:'#111'},{s:'TSLA',n:'Tesla',q:170,a:61,p:380.84,c:-2.61,col:'#e82127'},{s:'DIDIY',n:'DiDi Global',q:511,a:14,p:3.53,c:-.56,col:'#ff6b00'},{s:'LKNCY',n:'Luckin Coffee',q:68,a:2.53,p:30.6,c:-4.23,col:'#1261a0'}];let h=structuredClone(initial),side='BUY';const usd=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);function totals(){let cost=h.reduce((x,i)=>x+i.q*i.a,0),val=h.reduce((x,i)=>x+i.q*i.p,0);return{cost,val,pnl:val-cost}}function card(i){let v=i.q*i.p,c=i.q*i.a,p=v-c,r=c?p/c*100:0;return `<button class="holding" data-stock="${i.s}"><div class="logo" style="background:${i.col}">${i.s.slice(0,2)}</div><div class="meta"><div class="row"><div><div class="name">${i.s}</div><div class="sub">${i.n} · ${i.q} shares</div></div><div class="right"><div class="name">${usd(v)}</div><div class="sub ${p>=0?'positive':'negative'}">${p>=0?'+':''}${r.toFixed(2)}%</div></div></div><div class="row sub" style="margin-top:9px"><span>Avg ${usd(i.a)}</span><span class="${i.c>=0?'positive':'negative'}">${i.c>=0?'+':''}${i.c}% today</span></div></div></button>`}function render(){let t=totals();totalValue.textContent=usd(t.val);totalGain.textContent=`${t.pnl>=0?'+':''}${usd(t.pnl)} all time`;cost.textContent=usd(t.cost);homeHoldings.innerHTML=[...h].sort((a,b)=>b.q*b.p-a.q*a.p).slice(0,3).map(card).join('');allHoldings.innerHTML=h.map(card).join('');symbol.innerHTML=h.map(i=>`<option value="${i.s}">${i.s} · ${i.n}</option>`).join('');newsList.innerHTML=[['NVDA','Bullish','NVIDIA joins Japan national AI infrastructure project.','Government-backed demand supports the long-term data-center outlook.'],['AAPL','Bullish','Apple expands its long-term U.S. chip partnership.','Better supply-chain control may support future devices.'],['TSLA','Mixed','Tesla approaches earnings after strong deliveries.','Demand is strong, but margins and AI spending may create volatility.'],['DIDIY','Mixed','DiDi reports continued platform transaction growth.','Scale is positive, while OTC and regulatory risk remain.'],['LKNCY','Bullish','Luckin Coffee surpasses 35,000 locations.','Expansion and product diversification support growth.']].map(n=>`<article class="news"><span class="badge ${n[1]=='Mixed'?'mixed':''}">${n[1]}</span><h3>${n[0]} · ${n[2]}</h3><p>${n[3]}</p></article>`).join('');updateEstimate()}function updateEstimate(){let i=h.find(x=>x.s==symbol.value)||h[0],q=Math.max(1,+qty.value||1);estimate.textContent=usd(i.p*q);order.textContent=`Place demo ${side.toLowerCase()}`}function show(msg){toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',2600)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==b.dataset.screen));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n==b))});buyBtn.onclick=()=>{side='BUY';buyBtn.classList.add('on');sellBtn.classList.remove('on');updateEstimate()};sellBtn.onclick=()=>{side='SELL';sellBtn.classList.add('on');buyBtn.classList.remove('on');updateEstimate()};symbol.onchange=qty.oninput=updateEstimate;order.onclick=()=>{let i=h.find(x=>x.s==symbol.value),q=Math.max(1,Math.floor(+qty.value||1));if(side=='SELL'&&q>i.q){show(`You only own ${i.q} shares`);return}if(side=='BUY'){i.a=(i.a*i.q+i.p*q)/(i.q+q);i.q+=q}else i.q-=q;render();show(`${side=='BUY'?'Bought':'Sold'} ${q} ${i.s}`)};document.addEventListener('click',e=>{let b=e.target.closest('[data-stock]');if(b){symbol.value=b.dataset.stock;document.querySelector('[data-screen="trade"]').click();updateEstimate()}});render();</script></body></html>
